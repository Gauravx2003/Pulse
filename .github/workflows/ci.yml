name: CI

on:
  push:
    branches: [main, track-1, track-2, track-3]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Migration and seed version numbers
        run: scripts/check-migration-versions.sh
      - name: CODEOWNERS covers every module
        run: scripts/check-codeowners.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Seed extraction and generated seed SQL are current
        run: node --test seed/extract.test.mjs seed/build-sql.test.mjs

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: pulse
      DB_USER: pulse
      DB_PASSWORD: pulse_ci
      PULSE_REQUIRE_DB: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and unit tests
        run: mvn -B verify

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (includes pulse/no-hex-colors for .vue files)
        run: npm run lint
      - run: npm run build

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: OSV scan of backend and frontend dependencies
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --lockfile=backend/pom.xml
            --lockfile=frontend/package-lock.json
