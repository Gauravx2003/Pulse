version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse_secret_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse-backend
    restart: unless-stopped
    environment:
      PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulse
      DB_USER: pulse
      DB_PASSWORD: pulse_secret_dev
      PULSE_PROFILE: development
      PULSE_DEMO_SEED: "true"
      PULSE_TRUST_PROXY: "true"   # requests arrive through the frontend nginx, which sets X-Real-IP
      PULSE_APP_URL: http://localhost   # browser origin of the SPA: CORS and the Origin check on writes
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pulse-net

volumes:
  postgres_data:

networks:
  pulse-net:
    driver: bridge
