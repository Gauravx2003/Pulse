schema: spec-driven

context: |
  Backend is Java on Vert.x. All code must follow the "Vert.x & Java Coding Standards"
  in openspec/changes/pulse-v1-baseline/design.md (Decision 1):
  - Only two verticles: HttpServerVerticle (mounts /api/v1 sub-routers from self-registering
    modules) and SchedulerVerticle (in-process cron/periodic jobs). No verticle per module;
    modules are plain Java classes (Router, Service, Repository) sharing one PgPool and CalcService.
  - Never block the event loop: no synchronous I/O, Thread.sleep(), JDBC or heavy CPU loops in
    handlers/services. BCrypt, CSV parsing/validation (up to 5,000 rows) and seed file reading
    always run in vertx.executeBlocking(() -> ...).
  - DB access only via io.vertx.pgclient.PgPool with parameterized Tuple queries. Compose with
    Future.all(...) and .compose(...), not nested callbacks. Transactions use pool.withTransaction(conn -> ...).
  - Route failures go through ctx.fail(statusCode, exception) to one central FailureHandler that
    returns the standard JSON error contract (400, 403, 404, 409, 422).
  - No POJOs or DTO classes: pass io.vertx.core.json.JsonObject and JsonArray directly between repositories, services, 
    CalcService, and HTTP handlers (ctx.json(...)). Do not create model/dto/entity Java beans.
  - Generalized Data Access Layer: Do not write raw PgPool boilerplate or ad-hoc SQL strings inside HTTP handlers or services. Route all DB calls through a shared 
    BaseRepository/SqlExecutor helper (providing queryList, queryOne, execute, and dynamic filter/pagination builder) returning JsonArray/JsonObject, with SQL isolated in Repository classes.

rules:
  tasks:
    - Every task that adds a handler, service or repository must comply with the Vert.x & Java Coding Standards in design.md.

operations:
  apply:
    guidance:
      - Before writing code, re-read the Vert.x & Java Coding Standards in design.md. Reject and fix any code that blocks the event loop, deploys extra verticles, uses non-reactive DB access, or bypasses the central FailureHandler.
      - Reject and replace any POJO/DTO/entity classes with Vert.x JsonObject and JsonArray.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
