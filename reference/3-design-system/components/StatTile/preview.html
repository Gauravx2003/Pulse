<!-- @dsCard group="Metrics" height=150 subtitle="Headline KPI with band badge" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatTile — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{background:var(--surface)} .wrap{padding:16px} </style>
</head>
<body class="pl">
<div class="wrap">

<div class="pl-grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="pl-stat"><span class="pl-eyebrow">Tasks assigned</span><span class="pl-stat-value">14</span><span class="pl-stat-foot">Sprint 42 · 38 story points</span></div>
  <div class="pl-stat"><span class="pl-eyebrow">Not updated 2+ days</span><span class="pl-stat-value">4<small>/ 11 open</small></span><span class="pl-stat-foot"><span class="pl-badge is-accent">Stale</span> oldest 6 working days</span></div>
  <div class="pl-stat"><span class="pl-eyebrow">Work assigned</span><span class="pl-stat-value">11.5<small>d</small></span><span class="pl-stat-foot">vs 9.0 d capacity left</span></div>
  <div class="pl-stat"><span class="pl-eyebrow">Utilization</span><span class="pl-stat-value">128<small>%</small></span><span class="pl-stat-foot"><span class="pl-badge is-danger">Critical</span> over by 2.5 d</span></div>
</div>
</div>
</body>
</html>
