<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>UtilizationMeter — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0} body{background:var(--surface)} .wrap{padding:16px} </style>
</head>
<body class="pl">
<div class="wrap">

<div class="pl-card" style="max-width:640px">
  <div class="pl-card-head"><h3 class="pl-h3">Sprint utilization</h3><span class="pl-caption">Capacity line = 100%</span></div>
  <div class="pl-meter-row"><span>Priya Shah</span><div class="pl-meter" role="meter" aria-valuenow="128" aria-valuemin="0" aria-valuemax="140" aria-label="Priya Shah"><div class="pl-meter-fill is-danger" style="width:91.4%"></div><div class="pl-meter-mark" style="left:71.4%" title="Capacity"></div></div><span class="pl-mono" style="text-align:right">128%</span></div><div class="pl-meter-row"><span>Kiran Rao</span><div class="pl-meter" role="meter" aria-valuenow="95" aria-valuemin="0" aria-valuemax="140" aria-label="Kiran Rao"><div class="pl-meter-fill is-accent" style="width:67.9%"></div><div class="pl-meter-mark" style="left:71.4%" title="Capacity"></div></div><span class="pl-mono" style="text-align:right">95%</span></div><div class="pl-meter-row"><span>Arjun Mehta</span><div class="pl-meter" role="meter" aria-valuenow="77" aria-valuemin="0" aria-valuemax="140" aria-label="Arjun Mehta"><div class="pl-meter-fill is-ok" style="width:55.0%"></div><div class="pl-meter-mark" style="left:71.4%" title="Capacity"></div></div><span class="pl-mono" style="text-align:right">77%</span></div><div class="pl-meter-row"><span>Neha Joshi</span><div class="pl-meter" role="meter" aria-valuenow="46" aria-valuemin="0" aria-valuemax="140" aria-label="Neha Joshi"><div class="pl-meter-fill is-info" style="width:32.9%"></div><div class="pl-meter-mark" style="left:71.4%" title="Capacity"></div></div><span class="pl-mono" style="text-align:right">46%</span></div>
  <div style="display:grid;grid-template-columns:160px 1fr 64px;gap:12px"><span></span><div class="pl-meter-scale"><span>0</span><span>35</span><span>70</span><span>105</span><span>140%</span></div><span></span></div>
</div>
</div>
</body>
</html>
